name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar -czf shadeans-${{ matrix.name }}.tar.gz -C target/release shadeans
      - name: Package (windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/shadeans.exe -DestinationPath shadeans-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: shadeans-${{ matrix.name }}
          path: shadeans-${{ matrix.name }}.*
          if-no-files-found: error

  # A pushed v* tag publishes the three builds as a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
